<script>
/* ---------------------------------------------------------------------
   Tiny self-contained SHA-256 (no external libraries, nothing fetched).
   Implements FIPS 180-4 directly so this page has zero third-party
   dependencies – consistent with the rest of the site.
   --------------------------------------------------------------------- */
function rightRotate(value, amount) {
  return (value >>> amount) | (value << (32 - amount));
}
function sha256(ascii) {
  const mathPow = Math.pow;
  const maxWord = mathPow(2, 32);
  let result = '';
  const words = [];
  const asciiBitLength = ascii.length * 8;
  let hash = sha256.h = sha256.h || [];
  let k = sha256.k = sha256.k || [];
  let primeCounter = k.length;
  const isComposite = {};
  for (let candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (let i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
      k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
    }
  }
  ascii += '\x80';
  while (ascii.length % 64 - 56) ascii += '\x00';
  for (let i = 0; i < ascii.length; i++) {
    const j = ascii.charCodeAt(i);
    if (j >> 8) return null;
    words[i >> 2] |= j << ((3 - i) % 4) * 8;
  }
  words[words.length] = ((asciiBitLength / maxWord) | 0);
  words[words.length] = (asciiBitLength);
  for (let j = 0; j < words.length;) {
    const w = words.slice(j, j += 16);
    const oldHash = hash;
    hash = hash.slice(0, 8);
    for (let i = 0; i < 64; i++) {
      const w15 = w[i - 15], w2 = w[i - 2];
      const a = hash[0], e = hash[4];
      const temp1 = hash[7]
        + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
        + ((e & hash[5]) ^ (~e & hash[6]))
        + k[i]
        + (w[i] = (i < 16) ? w[i] : (
            w[i - 16]
            + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
            + w[i - 7]
            + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
          ) | 0
          );
      const temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
        + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
      hash = [(temp1 + temp2) | 0].concat(hash);
      hash[4] = (hash[4] + temp1) | 0;
    }
    for (let i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
  }
  for (let i = 0; i < 8; i++)
    for (let j = 3; j + 1; j--) {
      const b = (hash[i] >> (j * 8)) & 255;
      result += ((b < 16) ? '0' : '') + b.toString(16);
    }
  return result;
}

/* ---------------------------------------------------------------------
   Proof-of-work: find a nonce so that sha256(challenge + nonce) starts
   with DIFFICULTY hex zeros. Runs entirely client-side, in small
   batches, so the tab stays responsive and nothing is sent to a server.
   --------------------------------------------------------------------- */
const DIFFICULTY = 4; // leading hex zeros required (~65k tries on average)
const TARGET_PREFIX = "0".repeat(DIFFICULTY);
const EXPECTED_TRIES = Math.pow(16, DIFFICULTY);

// Changes daily, purely so the puzzle isn't the exact same string forever.
const today = new Date().toISOString().slice(0, 10);
const challenge = "xLift-contact-" + today + "-";

const triesEl = document.getElementById("tries");
const fillEl = document.getElementById("fill");
const hashlineEl = document.getElementById("hashline");
const resultEl = document.getElementById("result");
const resultInner = document.getElementById("result-inner");

// Address is assembled from parts and only rendered after the puzzle is
// solved – replace with your own inbox before publishing this page.
const MAILBOX = ["xlift", "consultant"];
const DOMAINENDING = "com"

let nonce = 0;

function step() {
  const batchEnd = nonce + 4000;
  let found = null;

  for (; nonce < batchEnd; nonce++) {
    const h = sha256(challenge + nonce);
    if (h.slice(0, DIFFICULTY) === TARGET_PREFIX) {
      found = h;
      break;
    }
  }

  triesEl.textContent = nonce.toLocaleString();
  hashlineEl.textContent = "sha256(" + challenge + nonce + ") …";

  const estimate = Math.min(96, (1 - Math.exp(-nonce / EXPECTED_TRIES)) * 100);
  fillEl.style.width = estimate + "%";

  if (found) {
    fillEl.style.width = "100%";
    hashlineEl.textContent = challenge + (nonce - 1) + " → " + found;

    const address = MAILBOX.join("@") + "." + DOMAINENDING;
    resultInner.innerHTML =
      "verified ✓<br><br>" +
      "<a href=\"mailto:" + address + "\">" + address + "</a>";
    resultEl.classList.add("visible");
    return;
  }

  setTimeout(step, 0);
}

step();
</script>
